<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Fylo data storage component</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body >
  <main class="container min-vh-100 d-flex align-items-center">
    <div class="row w-100 justify-content-center align-items-end g-4">

      <section class="col-12 col-md-4">

        <div class="fylo-card p-4">
          <img src="images/logo.svg" alt="Fylo logo" class="mb-4">

          <div class="d-flex gap-3">
         
            <div class="icon-box d-flex justify-content-center align-items-center p-3 rounded-3">
                <img src="images/icon-document.svg" alt="document Icon"> 
            </div>
            <div class="icon-box d-flex justify-content-center align-items-center p-3 rounded-3">
              <img src="images/icon-folder.svg" alt="folder Icon">
            </div>
            <div class="icon-box d-flex justify-content-center align-items-center p-3 rounded-3">
              <img src="images/icon-upload.svg" alt="upload Icon">
            </div>

          </div>

        </div>

      </section>

      <section class="col-12 col-md-6">
        
      </section>

    </div>
  </main>


 
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>

</body>

</html>
