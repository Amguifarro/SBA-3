<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Fylo data storage component</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body >
  <main class="container min-vh-100 d-flex align-items-center">
    <div class="row w-100 justify-content-center align-items-end g-4">

      <section class="col-11 col-md-4 col-lg-3">

        <div class="fylo-card px-4 py-3">
          <img src="images/logo.svg" alt="Fylo logo" class="mb-3">

          <div class="d-flex gap-3">
         
            <div class="icon-box d-flex justify-content-center align-items-center p-3 rounded-3">
                <img src="images/icon-document.svg" alt="document Icon"> 
            </div>
            <div class="icon-box d-flex justify-content-center align-items-center p-3 rounded-3">
              <img src="images/icon-folder.svg" alt="folder Icon">
            </div>
            <div class="icon-box d-flex justify-content-center align-items-center p-3 rounded-3">
              <img src="images/icon-upload.svg" alt="upload Icon">
            </div>

          </div>

        </div>

      </section>

      <section class="col-11 col-md-6 col-lg-5">

        <div class="storage-card px-4 py-3rounded-3">
          <p class="mb-3">You've used <strong> 815 GB</strong> of your storage</p>
        

        <div class="progress storage-progress">
          <div class="progress-bar" role="progressbar" style="width: 81.5%" aria-valuenow="815" aria-valuemin="0" aria-valuemax="1000">
          </div>
        </div>

        <div class="d-flex justify-content-between mt-2">
          <small class="fw-bold">0 GB</small>
          <small class="fw-bold">1000 GB</small>

          <div class="storage-remaining bg-white d-flex align-items-center gap-2 px-4 py-2 rounded-3">
           <span class="remaining-number fw-bold">185</span>
           <span class="remaining-text fw-bold">GB LEFT</span>

          </div>

        </div>

        

      </div>
      </section>

    </div>
  </main>


 
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>

</body>

</html>
